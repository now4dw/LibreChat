version: 1.3.5
cache: true

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "meta-llama/llama-3-8b-instruct"
        fetch: true
      titleConvo: true
      titleModel: "meta-llama/llama-3-8b-instruct"
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"

    - name: "BytePlus"
      apiKey: "${BYTEPLUS_KEY}"
      baseURL: "https://ark.ap-southeast.bytepluses.com/api/v3"
      models:
        default:
          - "dola-seedream-5-0-pro-260628"
        fetch: true
      titleConvo: true
      titleModel: "dola-seedream-5-0-pro-260628"
      modelDisplayLabel: "BytePlus"

  agents:
    capabilities:
      - skills
      - execute_code
      - file_search
      - actions
      - tools
