version: 1.3.5
cache: true
endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["meta-llama/llama-3-8b-instruct"]
        fetch: true
      titleConvo: true
      titleModel: "meta-llama/llama-3-8b-instruct"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter"
  agents:
    capabilities:
      - 'skills'  # Add this to enable skills
      - "execute_code"
      - "file_search"
      - "actions"
      - "tools"
