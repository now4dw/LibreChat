version: 1.3.5
cache: true

endpoints:
  agents:
    capabilities:
      - "execute_code"
      - "file_search"
      - "actions"
      - "tools"
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "deepseek/deepseek-v4-flash"
        fetch: true
      titleConvo: true
      titleModel: "deepseek/deepseek-v4-flash"
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"

    - name: "BytePlus"
      apiKey: "${BYTEPLUS_KEY}"
      baseURL: "https://ark.ap-southeast.bytepluses.com/api/v3"
      models:
        default:
          - "deepseek-v4-pro-260425"
          - "deepseek-v4-flash-260425"
          - "deepseek-v3-2-251201"
          - "deepseek-r1-250528"
          - "kimi-k2-thinking-251104"
          - "glm-4-7-251222"
        fetch: true
      titleConvo: true
      titleModel: "deepseek-v4-pro-260425"
      modelDisplayLabel: "BytePlus"
